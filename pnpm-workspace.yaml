packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@astrojs/check': 0.9.11
  '@astrojs/node': 11.1.9
  '@types/node': 26.6.5
  astro: 7.4.1
  dompurify: 3.4.17
  happy-dom: 21.0.3
  htmx.org: 2.0.10
  vite: 8.0.10

engineStrict: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10

minimumReleaseAgeExcludePrune: true

onlyBuiltDependencies:
  - esbuild

overrides:
  '@astrojs/check>typescript': 6.0.3

preferOffline: true

saveExact: true
