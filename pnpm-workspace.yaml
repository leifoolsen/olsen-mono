packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/node': 11.1.5
  '@types/node': 26.5.0
  astro: 7.3.2
  htmx.org: 2.0.10
  vite: 8.0.10

engineStrict: true

minimumReleaseAgeExcludePrune: true

onlyBuiltDependencies:
  - esbuild

overrides:
  '@astrojs/check>typescript': 6.0.3
  '@astrojs/ts-plugin>typescript': 6.0.3

preferOffline: true

saveExact: true
