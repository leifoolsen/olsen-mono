packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true

catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/node': 11.1.4
  '@types/node': ^26.4.1
  astro: 7.2.9
  htmx.org: ^2.0.10
  vite: ^8.0.10

engineStrict: true

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/node@11.0.3'
  - '@astrojs/markdown-satteri@0.3.5'
  - astro@7.2.9

onlyBuiltDependencies:
  - esbuild

overrides:
  '@astrojs/check>typescript': 6.0.3
  '@astrojs/ts-plugin>typescript': 6.0.3

preferOffline: true

saveExact: true
