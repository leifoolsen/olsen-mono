packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@astrojs/check': 0.9.10
  '@astrojs/node': 11.1.8
  '@types/node': 26.6.5
  astro: 7.4.0
  dompurify: 3.4.17
  happy-dom: 21.0.3
  htmx.org: 2.0.10
  vite: 8.0.10

engineStrict: true

minimumReleaseAgeExcludePrune: true

onlyBuiltDependencies:
  - esbuild

overrides:
  '@astrojs/check>typescript': 6.0.3

preferOffline: true

saveExact: true
