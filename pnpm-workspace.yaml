packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@astrojs/check': 0.9.12
  '@astrojs/node': 11.1.9
  '@types/node': 26.6.6
  '@types/sanitize-html': 2.16.2
  astro: 7.4.5
  happy-dom: 21.0.4
  htmx.org: 2.0.10
  sanitize-html: 2.18.2
  vite: 8.0.10

engineStrict: true

minimumReleaseAgeExcludePrune: true

onlyBuiltDependencies:
  - esbuild

overrides:
  '@astrojs/check>typescript': 6.0.3

preferOffline: true

saveExact: true
