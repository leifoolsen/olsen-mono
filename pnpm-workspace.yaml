packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  "@types/node": ^26.1.1
  "htmx.org": ^2.0.10
  "vite": ^8.0.10
overrides:
  "@astrojs/check>typescript": "6.0.3"
  "@astrojs/ts-plugin>typescript": "6.0.3"
saveExact: true
preferOffline: true
engineStrict: true
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.10.2'
  - '@astrojs/node@11.0.3'
  - '@astrojs/markdown-satteri@0.3.5'
  - astro@7.1.5 || 7.2.9
